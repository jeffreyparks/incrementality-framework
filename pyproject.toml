[project]
name = "arjentic-incrementality"
version = "0.1.0"
description = "Incrementality testing and evaluation harness for pulse and holdout experiments"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "jeffreyparks", email = "jeff@accolade.digital" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "arjentic.incrementality"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
